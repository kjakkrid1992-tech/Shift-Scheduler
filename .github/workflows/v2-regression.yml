name: V2 isolated regression
on:
  push:
    branches: [development-v2, ux-material3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: staff_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d staff_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: staff_ci
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-password
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript unit suites and syntax
        run: |
          set -e
          node --test tests/*.test.js
          for f in v2/*.js; do node --check "$f"; done
      - name: Bootstrap disposable PostgreSQL
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/ci_bootstrap.sql
          for f in supabase/migrations/*.sql; do echo "::group::$f"; psql -X -v ON_ERROR_STOP=1 -f "$f"; echo "::endgroup::"; done
          psql -X -v ON_ERROR_STOP=1 -f tests/ci_seed.sql
      - name: SQL regression suites
        run: |
          failures=0
          for f in supabase/tests/*.sql; do
            echo "::group::$f"
            if psql -X -v ON_ERROR_STOP=1 -f "$f"; then
              echo "PASS $f"
            else
              echo "::error::FAIL $f"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          test "$failures" -eq 0

  material-build:
    if: github.ref_name == 'ux-material3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile pinned Tailwind utilities
        run: npx --yes tailwindcss@3.4.17 -c design/tailwind.config.cjs -i design/tailwind.input.css -o v2/tailwind.utilities.css --minify
      - name: Install pinned browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Browser smoke using generated Tailwind CSS
        run: node tests/m3-browser.cjs
      - name: Demo all-menu smoke (offline fixture)
        run: node tests/demo-browser.cjs
